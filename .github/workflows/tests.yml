name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: aetherlens --db aetherlens-ci.sqlite import examples/sample_scans.json
      - run: aetherlens benchmark --aps 100 --repeats 1 --output json
      - run: aetherlens evaluate examples/labeled_cases.json --output json
      - run: aetherlens fuse examples/lab.capture.json examples/hall.capture.json --output json
      - run: aetherlens fuse examples/lab.capture.json examples/hall.capture.json --output html --save report.html
      - run: aetherlens plan examples/lab.capture.json examples/hall.capture.json --budget 1 --output json
      - run: aetherlens benchmark-fusion --aps 100 --sensors 3 --repeats 2 --output json
      - run: aetherlens lab --seeds 3 --loss 0 0.2 0.5 --output json
      - run: bash -n tools/hwsim_smoke.sh
        if: runner.os == 'Linux'
