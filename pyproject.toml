[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherlens"
version = "0.1.0"
description = "Wireless access-point discovery and change detection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AetherLens contributors"}]
dependencies = []

[project.scripts]
aetherlens = "aetherlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
